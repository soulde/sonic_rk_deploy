[project]
name = "sonic-rk-deploy"
version = "0.1.0"
description = "RK3588 RKNN model quantization and deployment"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "torchvision",
    "onnx>=1.14.0",
    "onnxruntime>=1.15.0",
    "numpy>=1.24.0",
    "joblib>=1.3.0",
    "mujoco>=3.1.0",
    "scipy>=1.10.0",
    "pillow>=9.0.0",
    "tqdm",
]

[project.optional-dependencies]
rknn = [
    # RKNN-Toolkit2 needs to be installed from local wheel
    # Run: uv pip install -e .[rknn] after installing rknn-toolkit2
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
